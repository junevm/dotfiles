[settings]
quiet = true

[env]
BACKUP_DIR = "backups"
GIT_REMOTE_URL = "git@github.com:junevm/dotfiles.git"
RESTORE_LOG_SUBDIR = ".local/state/dotfiles"
RESTORE_STATE_SUBDIR = ".local/state/dotfiles/restore"

# Space-separated package names only.
# Single source of truth for install targets (repo + AUR mixed allowed).
# Installer logic uses paru only.
INSTALL_PACKAGES = "ttf-google-sans ttf-jetbrains-mono-nerd bibata-cursor-theme-bin usage base-devel podman podman-compose aria2 ffmpeg syncthing  mise starship yt-dlp gnome-boxes gnome-software brave-bin cronie libreoffice-fresh gufw cachyos-gaming-meta cachyos-gaming-applications nautilus-open-in-ptyxis xterm envycontrol visual-studio-code-bin"
# Put optional removals in PACMAN_REMOVE_PACKAGES.
PACMAN_REMOVE_PACKAGES = "showtime shelly nvtop nano nano-syntax-highlighting firefox alacritty meld evince sushi papers gnome-system-monitor"

[tasks.restore]
description = "Restore system files and settings from backup"
run = """
set -Eeuo pipefail

LOG_DIR="$HOME/$RESTORE_LOG_SUBDIR"
STATE_DIR="$HOME/$RESTORE_STATE_SUBDIR"
LOCK_DIR="$STATE_DIR/lock"
CHECKPOINT_FILE="$STATE_DIR/checkpoints"
LOG_FILE="$LOG_DIR/restore.log"

mkdir -p "$LOG_DIR" "$STATE_DIR"
touch "$CHECKPOINT_FILE"

log() {
  printf '[%s] [restore] [%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" "$2" | tee -a "$LOG_FILE"
}

has_checkpoint() {
  grep -qxF "$1" "$CHECKPOINT_FILE"
}

add_checkpoint() {
  if ! has_checkpoint "$1"; then
    printf '%s\n' "$1" >> "$CHECKPOINT_FILE"
  fi
}

cleanup() {
  rm -rf "$LOCK_DIR"
}

on_error() {
  local code=$?
  log "ERROR" "restore failed with exit code ${code}; re-run 'mise run restore' to resume"
  exit "$code"
}

on_interrupt() {
  log "WARN" "restore interrupted; re-run 'mise run restore' to resume"
  exit 130
}

trap cleanup EXIT
trap on_error ERR
trap on_interrupt INT TERM

if ! mkdir "$LOCK_DIR" 2>/dev/null; then
  log "ERROR" "another restore appears to be running (lock: $LOCK_DIR)"
  exit 1
fi

run_step() {
  local key="$1"
  local task="$2"

  if has_checkpoint "$key"; then
    log "INFO" "skip $key (already complete)"
    return 0
  fi

  log "INFO" "run $key -> $task"
  mise run "$task"
  add_checkpoint "$key"
  log "INFO" "done $key"
}

log "INFO" "starting restore orchestrator"

run_step "restore:checks" "restore:checks"
run_step "restore:mirrors" "restore:mirrors"
run_step "restore:system:packages" "restore:system:packages"
run_step "restore:system:firewall" "restore:system:firewall"
run_step "restore:apps:bundle" "restore:apps:bundle"
run_step "restore:desktop:state" "restore:desktop:state"
run_step "restore:cron" "restore:cron"
run_step "restore:dotfiles" "restore:dotfiles"
run_step "restore:cleanup" "restore:cleanup"

log "INFO" "restore complete. Reboot to apply all changes."
"""

[tasks."restore:state:reset"]
description = "Reset restore checkpoints/log state for a full rerun"
run = """
set -Eeuo pipefail
STATE_DIR="$HOME/$RESTORE_STATE_SUBDIR"
rm -rf "$STATE_DIR"
echo "Restore state reset: $STATE_DIR"
"""

[tasks."restore:checks"]
description = "Preflight checks for CachyOS restore"
run = [
  "test -r /etc/os-release",
  ". /etc/os-release && ( [ \"${ID}\" = 'cachyos' ] || ( printf '%s' \"${PRETTY_NAME:-${NAME:-}}\" | grep -qi 'cachyos' && printf '%s' \"${ID_LIKE:-}\" | grep -qi 'arch' ) || [ \"${DOTFILES_ALLOW_UNSUPPORTED:-0}\" = '1' ] )",
  "command -v git >/dev/null",
  "command -v sudo >/dev/null",
  "command -v paru >/dev/null",
  "command -v cachyos-rate-mirrors >/dev/null",
  "sudo -v",
  "mkdir -p $BACKUP_DIR",
]

[tasks."restore:mirrors"]
description = "Refresh CachyOS mirror ranking before package operations"
run = ["sudo cachyos-rate-mirrors"]

[tasks."restore:dotfiles"]
description = "Apply chezmoi-managed dotfiles"
run = ["command -v chezmoi >/dev/null", "chezmoi apply -v"]


[tasks."restore:system:packages"]
description = "Install system packages and desktop integrations"
run = """
set -u

LOG_DIR="$HOME/$RESTORE_LOG_SUBDIR"
LOG_FILE="$LOG_DIR/restore-system-packages.log"
mkdir -p "$LOG_DIR"

log() {
  printf '[%s] [restore:system:packages] [%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" "$2" | tee -a "$LOG_FILE"
}

install_list() {
  local installer="$1"
  local packages="$2"
  local ok=0
  local fail=0

  for pkg in $packages; do
    if $installer "$pkg"; then
      ok=$((ok + 1))
      log "INFO" "installed: $pkg"
    else
      fail=$((fail + 1))
      log "WARN" "failed: $pkg"
    fi
  done

  log "INFO" "summary for installer '$installer' => success=$ok failed=$fail"
}

install_packages() {
  local packages="$1"
  local ok=0
  local fail=0

  if ! command -v paru >/dev/null 2>&1; then
    log "ERROR" "paru is required for restore:system:packages"
    return 1
  fi

  for pkg in $packages; do
    if paru -S --needed --noconfirm "$pkg"; then
      ok=$((ok + 1))
      log "INFO" "installed via paru: $pkg"
    else
      fail=$((fail + 1))
      log "WARN" "failed via paru: $pkg"
    fi
  done

  log "INFO" "summary install => paru_success=$ok paru_fail=$fail"
}

log "INFO" "starting package restore"
install_packages "$INSTALL_PACKAGES"

if systemctl --user enable --now syncthing.service >/dev/null 2>&1; then
  log "INFO" "syncthing user service enabled"
else
  log "WARN" "could not enable syncthing user service"
fi

log "INFO" "removing optional GNOME apps"
install_list "paru -Rns --noconfirm" "$PACMAN_REMOVE_PACKAGES"

log "INFO" "package restore finished"
"""

[tasks."restore:system:firewall"]
description = "Apply UFW rules for Applications"
run = """
set -Eeuo pipefail

LOG_DIR="$HOME/$RESTORE_LOG_SUBDIR"
LOG_FILE="$LOG_DIR/restore-system-firewall.log"
mkdir -p "$LOG_DIR"

log() {
  printf '[%s] [restore:system:firewall] [%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" "$2" | tee -a "$LOG_FILE"
}

if ! command -v ufw >/dev/null 2>&1; then
  log "ERROR" "ufw is required for restore:system:firewall"
  exit 1
fi

log "INFO" "allowing GSConnect traffic"
sudo ufw allow proto tcp from 192.168.1.0/24 to any port 1714:1764 || true
sudo ufw allow proto udp from 192.168.1.0/24 to any port 1714:1764 || true

log "INFO" "allowing Syncthing traffic"
sudo ufw allow syncthing || true

log "INFO" "enabling and reloading ufw"
sudo ufw --force enable
sudo ufw reload

log "INFO" "ufw rules applied"
"""

[tasks."restore:apps:bundle"]
description = "Install non-native app layer via Homebrew Bundle"
env = { BREW_FALLBACK_BIN = "/home/linuxbrew/.linuxbrew/bin/brew" }
run = """
set -u

LOG_DIR="$HOME/$RESTORE_LOG_SUBDIR"
LOG_FILE="$LOG_DIR/restore-apps-bundle.log"
mkdir -p "$LOG_DIR"

log() {
  printf '[%s] [restore:apps:bundle] [%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" "$2" | tee -a "$LOG_FILE"
}

if ! command -v brew >/dev/null 2>&1; then
  log "INFO" "homebrew not found; attempting installation"
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || log "WARN" "homebrew install failed"
fi

BREW_BIN="$(command -v brew || true)"
if [ -z "$BREW_BIN" ] && [ -x "$BREW_FALLBACK_BIN" ]; then
  BREW_BIN="$BREW_FALLBACK_BIN"
fi

if [ -n "$BREW_BIN" ] && [ -f "$BACKUP_DIR/brew/Brewfile" ]; then
  log "INFO" "running brew bundle for non-native packages"
  "$BREW_BIN" bundle --file="$BACKUP_DIR/brew/Brewfile" || log "WARN" "brew bundle completed with errors"
else
  log "WARN" "brew not available or Brewfile missing; skipping brew bundle"
fi
"""

[tasks."restore:desktop:state"]
description = "Restore GNOME and wallpapers"
run = [
  # gnome and all
  "mkdir -p ~/.local/share/gnome-shell/extensions",
  "if [ -d \"$BACKUP_DIR/gnome/extensions\" ]; then cp -r $BACKUP_DIR/gnome/extensions/* ~/.local/share/gnome-shell/extensions/ 2>/dev/null || true; fi",
  "if command -v dconf >/dev/null 2>&1 && [ -f \"$BACKUP_DIR/gnome/settings.ini\" ]; then dconf load /org/gnome/ < $BACKUP_DIR/gnome/settings.ini || true; fi",
  "rm -rf ~/Pictures/Wallpapers && mkdir -p ~/Pictures/Wallpapers",
  "cp -r $BACKUP_DIR/wallpapers/* ~/Pictures/Wallpapers/ 2>/dev/null || true",
]

[tasks."restore:cron"]
description = "Restore user cron jobs"
run = [
  "if ! command -v crontab >/dev/null 2>&1; then paru -S --needed --noconfirm cronie || true; fi",
  "if command -v systemctl >/dev/null 2>&1; then sudo systemctl enable --now cronie.service || true; fi",
  "if command -v crontab >/dev/null 2>&1 && [ -f \"$BACKUP_DIR/cron/cron\" ]; then crontab $BACKUP_DIR/cron/cron; fi",
]

[tasks."restore:cleanup"]
description = "Finalize restore and switch git remote to SSH"
run = [
  "if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then git remote set-url origin \"$GIT_REMOTE_URL\" || true; fi",
]

[tasks.backup]
description = "Backup system files and settings"
run = [
  "mise run backup:clean",
  "mise run backup:desktop:state",
  "mise run backup:homebrew",
  "mise run backup:wallpapers",
  "mise run backup:cron",
  "mise run backup:chezmoi",
]

[tasks."backup:clean"]
description = "Clean previous backup directory"
run = ["rm -rf $BACKUP_DIR"]

[tasks."backup:desktop:state"]
description = "Backup GNOME settings"
run = [
  "mkdir -p $BACKUP_DIR/gnome",
  "dconf dump /org/gnome/ > $BACKUP_DIR/gnome/settings.ini",
  "gnome-extensions list --enabled --user > $BACKUP_DIR/gnome/extensions.txt",
  "rm -rf $BACKUP_DIR/gnome/extensions",
  "mkdir -p $BACKUP_DIR/gnome/extensions",
  "gnome-extensions list --enabled --user | while read ext; do if [ -d \"$HOME/.local/share/gnome-shell/extensions/$ext\" ]; then cp -r \"$HOME/.local/share/gnome-shell/extensions/$ext\" $BACKUP_DIR/gnome/extensions/; fi done",
]

[tasks."backup:homebrew"]
description = "Backup Homebrew Bundle manifest (non-native packages)"
run = [
  "mkdir -p $BACKUP_DIR/brew",
  "/home/linuxbrew/.linuxbrew/bin/brew bundle dump --no-vscode --file=$BACKUP_DIR/brew/Brewfile --force",
]

[tasks."backup:wallpapers"]
description = "Backup wallpapers directory"
run = [
  "rm -rf $BACKUP_DIR/wallpapers",
  "mkdir -p $BACKUP_DIR/wallpapers",
  "cp -r ~/Pictures/Wallpapers/* $BACKUP_DIR/wallpapers/ 2>/dev/null || true",
]

[tasks."backup:cron"]
description = "Backup user crontab"
run = [
  "mkdir -p $BACKUP_DIR/cron",
  "if command -v crontab >/dev/null 2>&1; then crontab -l > $BACKUP_DIR/cron/cron || echo '# No crontab for this user' > $BACKUP_DIR/cron/cron; else echo '# crontab command not found on this system.' > $BACKUP_DIR/cron/cron; fi",
]

[tasks."backup:chezmoi"]
description = "Backup chezmoi-managed dotfiles"
run = [
  # re-add files that change outside of chezmoi (like bookmarks) to update the source state
  "chezmoi re-add ~/.config/BraveSoftware/Brave-Browser/Default/Bookmarks",

  # apply manually made changes to source state and push to remote
  "chezmoi apply -v",
  "git add .",
  "git diff --cached --quiet || git commit -m \"chezmoi - update $(date '+%B %e, %Y %I:%M %p')\"",
  "git push",
]
