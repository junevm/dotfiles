[tools]
"github:junevm/msifancontrol" = "latest"
"github:junevm/cdns" = "latest"
node = "lts"

[tasks.system-stats]
alias = "sys"
description = "Show system stats with btop"
run = "btop --force-utf"

[tasks.system-info]
alias = "info"
description = "Show system information with fastfetch"
run = "fastfetch"

[tasks.system-upgrade]
alias = "update"
description = "Do a full system upgrade"
run = ["shelly upgrade all --no-confirm"]

[tasks.dotfiles-backup]
description = "backup dotfiles"
run = [
  "echo 'backing up dotfiles...' && cd ~/.local/share/chezmoi && mise run backup",
]

[tasks.fan-control]
alias = "fan"
description = "Control fan speed with msifancontrol"
run = "msifancontrol"

[tasks.dns-switch]
alias = "dns"
description = "Change DNS interactively using cdns"
run = "cdns"

[tasks.gpu-mode]
alias = "gpu"
description = "Interactive GPU mode selector (status/integrated/hybrid/nvidia)"
run = """
set -u

# mise task shells may not source interactive shell config.
export PATH="$HOME/.local/bin:$PATH"

pick_mode() {
  if command -v fzf >/dev/null 2>&1; then
    printf '%s\n' status integrated hybrid nvidia | fzf --prompt='GPU mode > ' --height=10 --reverse --border
    return
  fi

  echo "fzf not found; using fallback selection."
  select mode in status integrated hybrid nvidia; do
    printf '%s\n' "$mode"
    return
  done
}

switch_mode() {
  mode="$1"
  echo "Switching to $mode mode."
  echo "This may take 1-3 minutes while initramfs is rebuilt. Please wait..."

  sudo "$ENVYCONTROL_BIN" --switch "$mode" &
  SWITCH_PID=$!

  while kill -0 "$SWITCH_PID" >/dev/null 2>&1; do
    printf '.'
    sleep 5
  done
  echo

  wait "$SWITCH_PID"
}

ENVYCONTROL_BIN="$(command -v envycontrol || true)"
if [ -z "$ENVYCONTROL_BIN" ]; then
  echo "envycontrol not found in PATH: $PATH"
  exit 1
fi

echo "Current GPU mode:"
"$ENVYCONTROL_BIN" --query || true

MODE="$(pick_mode)"

case "$MODE" in
  status)
    echo "Current GPU mode:"
    "$ENVYCONTROL_BIN" --query
    ;;
  integrated|hybrid|nvidia)
    if switch_mode "$MODE"; then
      echo "Switched to $MODE mode. Reboot is recommended."
    else
      echo "Failed to switch to $MODE mode."
      exit 1
    fi
    ;;
  *)
    echo "No valid selection made; exiting."
    exit 1
    ;;
esac
"""


[tasks.git-commit]
alias = "gcm"
description = "git add and commit"
run = '''
read -p "Enter commit message: " msg
git add .
git commit -m "$msg"
echo "changes staged and committed with message: $msg"
'''

[tasks.git-pull]
alias = "gpl"
description = "git pull"
run = '''
git pull
'''

[tasks.git-fix-ignore]
alias = "gfix"
description = "fix gitignore not working https://stackoverflow.com/questions/25436312/gitignore-not-working"
run = '''
git rm -rf --cached .
git add .
'''

[tasks.crontab-edit]
alias = "crontab"
description = "Edit crontab with micro"
run = "EDITOR=micro crontab -e"

[tasks.chezmoi-open]
alias = "chezmoi"
description = "open chezmoi source directory in VSCode"
run = ["code $(chezmoi source-path)"]

[tasks.git-summary]
alias = "gsummary"
description = "Show git summary of all repos in the current directory"
run = '''
for d in */; if test -d "$d.git"; printf "\n=== %s ===\n" $d; git -C $d status -s; end; end
'''


[tasks."youtube-download"]
alias = "ytdl"
description = "Download YouTube video using jim60105/docker-yt-dlp"
usage = """
arg "[url]" help="YouTube URL"
arg "[args]..." help="Optional extra yt-dlp arguments"
"""
dir = "{{cwd}}"
run = """
if [ -n "$usage_url" ]; then
  URL="$usage_url"
else
  read -p 'YouTube URL: ' URL
fi

if [ -z "$URL" ]; then
  echo "Error: No YouTube URL provided." >&2
  exit 1
fi

DOCKER_BIN="$(command -v docker || command -v podman)"
if [ -z "$DOCKER_BIN" ]; then
  echo "Error: Neither docker nor podman was found in PATH." >&2
  exit 1
fi

USER_FLAGS="--user $(id -u):$(id -g)"
if "$DOCKER_BIN" --version 2>&1 | grep -qi podman; then
  USER_FLAGS="--userns=keep-id --user $(id -u):$(id -g)"
fi

TTY_FLAG="-i"
if [ -t 0 ]; then
  TTY_FLAG="-it"
fi

if [ -n "$usage_args" ]; then
  eval "set -- $usage_args"
  "$DOCKER_BIN" run --rm $TTY_FLAG $USER_FLAGS \
    -v "$PWD:/download:Z" \
    ghcr.io/jim60105/yt-dlp:pot \
    "$@" "$URL"
else
  "$DOCKER_BIN" run --rm $TTY_FLAG $USER_FLAGS \
    -v "$PWD:/download:Z" \
    ghcr.io/jim60105/yt-dlp:pot \
    "$URL"
fi
"""
